<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号设置 · 本地视频库</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header compact topbar">
    <div class="header-brand-group">
      <a class="brand" href="/"><span class="brand-mark">V</span><span class="brand-text">LOCAL <em>VIDEO</em></span></a>
      <a class="back-link" href="/">返回</a>
    </div>
  </header>
  <main class="account-page">
    <section class="account-card">
      <p class="eyebrow">ACCOUNT</p>
      <h1>{{ identity.username }}</h1>
      <p class="stats">角色：{{ identity.role_label }}</p>
      {% if identity.must_change_password %}
      <p class="account-error">
        首次登录必须先修改初始密码，完成前不能访问其他管理功能。
      </p>
      {% endif %}
      {% if notice %}<p class="account-success">{{ notice }}</p>{% endif %}
      <form method="post" action="/account/password" class="account-form">
        <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required></label>
        <label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="{{ min_password_length }}" required></label>
        {% if error %}<p class="account-error">{{ error }}</p>{% endif %}
        <button class="download-primary-button" type="submit">修改密码</button>
      </form>
      <form method="post" action="/logout">
        <button class="download-secondary-button" type="submit">退出登录</button>
      </form>
    </section>
  </main>
</body>
</html>
